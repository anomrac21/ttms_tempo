theme = '_menus_ttms'
languageCode = 'en-tt'
title = 'Tempo Nightclub'
baseURL = 'https://tempo.ttmenus.com/'
timeout = '180s'

# Mount home, generated menu tree, and theme pages (dashboard, locations, api).
[module]
  [[module.mounts]]
    source = "content/_index.md"
    target = "content/_index.md"
  [[module.mounts]]
    source = "content/.generated"
    target = "content"
  [[module.mounts]]
    source = "themes/_menus_ttms/content"
    target = "content"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      attribute = true
    [markup.goldmark.renderer]
      unsafe = true

[outputFormats]
  [outputFormats.menuitemsJSON]
    mediaType = "application/json"
    baseName = "menu-items"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML", "JSON"]
  page = ["HTML", "JSON"]

[params]
  description = "Tempo Nightclub — food, cocktails, and hookah in San Fernando."
  authServiceUrl = "https://auth.ttmenus.com"
  adsServiceUrl = "https://ads.ttmenus.com"
  notifyServiceUrl = "https://notify.ttmenus.com"

[params.auth]
  enabled = true
  apiUrl = "https://auth.ttmenus.com/api/v1"

[params.reviews]
  enabled = true
  apiUrl = "https://reviews.ttmenus.com/api/v1"

[params.contentManagement]
  enabled = true
  apiUrl = "https://cms.ttmenus.com/api"
  serviceUrl = "https://cms.ttmenus.com"
  clientId = "ttms_tempo"

[params.content]
  enabled = true
  apiUrl = "https://cms.ttmenus.com/api"
  clientId = "ttms_tempo"

[params.menu]
  multiLocationMenus = false

[params.mapService]
  url = "https://maps.ttmenus.com"
  dataSource = "trinidad-tobago"

[params.osrm]
  url = "https://osrm.ttmenus.com"

[params.orderService]
  apiUrl = "https://orders.ttmenus.com/api/v1"
  enabled = true
  kitchenPrint = false
  paperWidthMm = 80
  printerName = ""

[params.deliveryService]
  apiUrl = "https://delivery.ttmenus.com/api/v1"
  currency = "TTD"
  deliveryFee = 0
  enabled = false
  wsUrl = "wss://delivery.ttmenus.com/api/v1"

# Menu images (approved uploads) — same stack as menudemo / current clients
[params.menuImageService]
  enabled = true
  apiUrl = "https://menu-images.ttmenus.com/api/v1"

# Thumbor — dashboard previews + menu images
[params.thumbor]
  enabled = true
  url = "https://thumbor.ttmenus.com"
  sourceBaseUrl = "https://tempo.ttmenus.com"
  menuImagesUseThumbor = true

[params.ads]
  clientId = "ttms_tempo"
  enabled = true
  apiUrl = "https://ads.ttmenus.com/api/v1"

[params.notifications]
  enabled = true
  apiUrl = "https://notify.ttmenus.com/api/v1"
  websocketUrl = "wss://notify.ttmenus.com/api/v1/ws/connect"
  serviceUrl = "https://notify.ttmenus.com"
  clientDomain = "tempo.ttmenus.com"

# Override theme demo defaults — payments not enabled for Tempo
[params.paymentService]
  enabled = false
  apiUrl = "https://pay.tempo.ttmenus.com"
  clientId = "ttms_tempo"
  currency = "TTD"
  provider = "wipay"

[params.features]
  loyverse_connect = false
  payments = false
  delivery = false
  notifications = true
  analytics_access = false
  featured = false
  exclusive_ads = false
  no_competitor_ads = false
  unmetered_traffic = false

[params.posintegration]
  enabled = false
  provider = ""
  api_url = ""
  oauth_url = "https://loyverse-oauth.ttmenus.com"
  store_id = ""
  sync_menu = false
  auto_process_orders = false
  fallback_to_whatsapp = true
  loyverse_receipt_mode = "on_payment"

[params.orderingsystem]
  enabled = true
  orderingDisabledMessage = "Ordering is not available for this menu at this time."
  vat = 0
  servicecharge = 0.1
  hastables = true
  usephonecall = false
  whatsapp = 18687498776
  phone = 18682398364

[params.services]
  analyticsid = 20
  notifications = true

[params.social]
  youtube = ""
  email = "admin@tempoentertainmenttt.com"
  phone = 18682398364
  facebook = "https://www.facebook.com/share/14QHQYi34V7/"
  instagram = "https://www.instagram.com/tempoentertainmenttt/"
  tiktok = "https://www.tiktok.com/@tempo.nightclubandlounge"

[privacy]
  [privacy.instagram]
    simple = false
    disable = false

[taxonomies]
  ingredient = "ingredients"
  cookingmethod = "cookingmethods"
  tag = "tags"
  category = "categories"
  subcategory = "subcategories"
  type = "types"
  event = "events"
