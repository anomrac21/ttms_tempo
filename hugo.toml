theme = '_menus_ttms'
languageCode = 'en-tt'

# Project menu + theme system pages (login, update-ui, 404, admin, etc.)
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "themes/_menus_ttms/content"
    target = "content"
  [[module.mounts]]
    source = "../_ttms_clienttools/icons"
    target = "static/icons"

title = 'Tempo Nightclub'
baseURL = 'https://tempo.ttmenus.com/'

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      attribute = true
    [markup.goldmark.renderer]
      unsafe = true

[outputFormats]
  [outputFormats.menuitemsJSON]
    mediaType = "application/json"
    baseName = "menu-items"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML", "JSON"]
  page = ["HTML", "JSON"]

[params]
  authServiceUrl = "https://auth.ttmenus.com"
  adsServiceUrl = "https://ads.ttmenus.com"
  notifyServiceUrl = "https://notify.ttmenus.com"

[params.auth]
  enabled = true
  apiUrl = "https://auth.ttmenus.com/api/v1"

[params.contentManagement]
  enabled = true
  apiUrl = "https://cms.ttmenus.com/api"
  serviceUrl = "https://cms.ttmenus.com"
  clientId = "ttms_tempo"

# Menu images (approved uploads) — same stack as menudemo / current clients
[params.menuImageService]
  enabled = true
  apiUrl = "https://menu-images.ttmenus.com/api/v1"

[params.ads]
  clientId = "ttms_tempo"
  enabled = true
  apiUrl = "https://ads.ttmenus.com/api/v1"

[params.notifications]
  enabled = true
  apiUrl = "https://notify.ttmenus.com/api/v1"
  websocketUrl = "wss://notify.ttmenus.com/api/v1/ws/connect"
  serviceUrl = "https://notify.ttmenus.com"

[params.features]
  payments = false
  delivery = false
  notifications = true

[params.orderingsystem]
  enabled = true
  orderingDisabledMessage = "Ordering is not available for this menu at this time."
  vat = 0
  servicecharge = 0
  hastables = true
  usephonecall = false
  whatsapp = 18687498776
  phone = 18682398364

[params.services]
  analyticsid = 0
  notifications = true

[params.social]
  youtube = ""
  email = "admin@tempoentertainmenttt.com"
  phone = 18682398364
  facebook = "https://www.facebook.com/share/14QHQYi34V7/"
  instagram = "https://www.instagram.com/tempoentertainmenttt/"
  tiktok = "https://www.tiktok.com/@tempo.nightclubandlounge"

[privacy]
  [privacy.instagram]
    simple = false
    disable = false

[taxonomies]
  ingredient = "ingredients"
  cookingmethod = "cookingmethods"
  tag = "tags"
  category = "categories"
  subcategory = "subcategories"
  type = "types"
  event = "events"
