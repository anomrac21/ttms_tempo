<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Menu Editor | </title><link rel=stylesheet href=/css/main.css><link rel=stylesheet href=/css/colors.css><link rel=stylesheet href=/css/custom.css><link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css><link rel=stylesheet href=/css/update-ui.css><style>.update-ui-navbar{position:fixed;top:0;left:0;right:0;width:100%;height:60px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-bottom:1px solid rgba(255,255,255,.1);z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}.navbar-left{display:flex;align-items:center;gap:1.5rem;flex:1}.navbar-logo{font-size:1.25rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:.5rem;cursor:pointer;padding:.5rem;border-radius:6px;transition:all .3s ease;user-select:none}.navbar-logo:hover{background:rgba(255,255,255,.1)}.navbar-logo:active{transform:scale(.95)}.navbar-logo .view-indicator{font-size:.875rem;opacity:.7;font-weight:400;margin-left:.25rem}.navbar-nav{display:flex;gap:.5rem}.navbar-nav-btn{padding:.5rem 1rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;cursor:pointer;transition:all .3s ease;font-size:.875rem;display:flex;align-items:center;gap:.5rem}.navbar-nav-btn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}.navbar-nav-btn.active{background:rgba(102,126,234,.3);border-color:rgba(102,126,234,.5)}.navbar-right{display:flex;align-items:center;gap:1rem;flex-shrink:0}.navbar-actions{display:flex;gap:.5rem}.btn-navbar{padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;font-size:.875rem;font-weight:600;transition:all .3s ease;display:flex;align-items:center;gap:.5rem}.btn-navbar-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}.btn-navbar-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,.4)}.btn-navbar-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}.btn-navbar-secondary:hover{background:rgba(255,255,255,.2)}.update-ui-container{margin-top:60px;min-height:calc(100vh - 60px);background:var(--main-bg,#000);width:100%;position:relative}.update-ui-preview{width:100%;min-height:calc(100vh - 60px)}.update-ui-preview iframe{width:100%;height:calc(100vh - 60px);border:none}.edit-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:2rem}.edit-modal-content{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-radius:12px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1)}.edit-modal-header{padding:1.5rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}.edit-modal-header h2{margin:0;color:#fff;font-size:1.5rem}.edit-modal-close{background:0 0;border:none;color:#fff;font-size:2rem;cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background .3s ease}.edit-modal-close:hover{background:rgba(255,255,255,.1)}.edit-modal-body{padding:1.5rem}.menu-item-card.editable{position:relative;cursor:pointer;transition:all .3s ease}.menu-item-card.editable:hover{outline:2px solid rgba(102,126,234,.5);outline-offset:4px}.menu-item-card.editing{outline:2px solid #667eea;outline-offset:4px;background:rgba(102,126,234,.1)}.edit-overlay{position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.8);color:#fff;padding:.25rem .5rem;border-radius:4px;font-size:.75rem;opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:10}.menu-item-card.editable:hover .edit-overlay{opacity:1}.settings-panel{position:fixed;top:60px;right:-400px;width:400px;height:calc(100vh - 60px);background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-left:1px solid rgba(255,255,255,.1);z-index:999;transition:right .3s ease;overflow-y:auto;box-shadow:-4px 0 12px rgba(0,0,0,.3)}.settings-panel.open{right:0}.settings-panel-header{padding:1.5rem;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}.settings-panel-title{font-size:1.25rem;font-weight:700;color:#fff}.settings-panel-close{background:0 0;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background .3s ease}.settings-panel-close:hover{background:rgba(255,255,255,.1)}.settings-panel-content{padding:1.5rem}.edit-form-container{padding:1rem;background:rgba(0,0,0,.3);border-radius:8px}.edit-form-container .form-group{margin-bottom:1rem}.edit-form-container label{display:block;margin-bottom:.5rem;color:#fff;font-weight:600;font-size:.875rem}.edit-form-container .form-input,.edit-form-container .form-textarea{width:100%;padding:.75rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;font-size:.875rem}.edit-form-container .form-input:focus,.edit-form-container .form-textarea:focus{outline:none;border-color:#667eea;background:rgba(255,255,255,.15)}.edit-form-container .form-textarea{min-height:100px;resize:vertical}.price-entry{display:flex;gap:.5rem;margin-bottom:.5rem}.price-entry input{flex:1;padding:.5rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:4px;color:#fff;font-size:.875rem}.edit-form-actions{display:flex;gap:.5rem;margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.1)}@media(max-width:768px){.navbar-nav{display:none}.navbar-actions span:not(:first-child){display:none}.settings-panel{width:100%;right:-100%}.edit-modal-content{max-width:95%;padding:1rem}}</style></head><body><div class=update-ui-navbar><div class=navbar-left><div class=navbar-logo onclick=MenuEditor.toggleEditMode() title="Click to toggle edit mode"><span id=viewIcon>👁️</span>
